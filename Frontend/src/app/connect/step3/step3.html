<header class="public-header">
  <a class="brand" routerLink="/"><span class="brand-mark">t</span>trellis</a>
  <small>Account setup</small>
</header>
<main class="step-page">
  <p class="eyebrow">Step 3 of 3 · Ready</p>
  <div class="progress" aria-hidden="true">
    <span class="done"></span><span class="done"></span><span class="done"></span>
  </div>
  <h1>Your Instagram connection</h1>
  @if (username()) {
    <section class="panel">
      <h2>&#64;{{ username() }} is connected</h2>
      <p>Open your dashboard to load your current follower count.</p>
      <a class="button primary" routerLink="/dashboard">Open dashboard</a>
    </section>
  } @else if (error()) {
    <p role="alert">{{ error() }}</p>
    <a class="button" routerLink="/step1">Connect Instagram</a>
  } @else {
    <p role="status">Checking your saved connection…</p>
  }
</main>
